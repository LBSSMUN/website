<!DOCTYPE html>
<html lang="en">
<head>
    <title>404</title>
    <script>
        (async function(){
            const currentLoc = window.location.href;
            const start = currentLoc.indexOf("lbssmun");
            const key = currentLoc.slice(start + "lbssmun".length);
            const res = await fetch("/redirects.json");
            if (!res.ok) return;
            const obj = await res.json();
            const redirectURL = obj[key];
            if (typeof redirectURL === "string" && redirectURL.trim() !== "" && /^https?:\/\//i.test(redirectURL)) {
                window.location.replace(redirectURL);
            }
        })();
    </script>
    <script src="/style.js"></script>
    <link rel ="stylesheet" href="https://lbssmun.com/style.css">
</head>
<body>
    <main id="pageContent">
        <h1>404: Page Not Found</h1>
        <p>The page you are looking for does not exist, has been moved, or you entered the address incorrectly.</p>
        <a class="blockLink" href="/">Return to Home</a>
        <script async src="https://cse.google.com/cse.js?cx=c2830d81718754798"></script>
        <div id="searchwrapper"><div class="gcse-search"></div></div>
    </main>
</body>
</html>
